<!DOCTYPE html>

<html lang="ko"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&amp;family=Be+Vietnam+Pro:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "outline-variant": "#c1c7d2",
              "tertiary-fixed-dim": "#fbbb45",
              "outline": "#717782",
              "on-tertiary-container": "#fffbff",
              "on-tertiary-fixed-variant": "#5f4100",
              "on-secondary-fixed": "#410006",
              "surface": "#f9f9fd",
              "secondary": "#ae2f34",
              "primary": "#005ea1",
              "secondary-container": "#ff6b6b",
              "error": "#ba1a1a",
              "surface-tint": "#0061a5",
              "surface-container-lowest": "#ffffff",
              "on-error-container": "#93000a",
              "on-background": "#1a1c1f",
              "primary-fixed": "#d2e4ff",
              "inverse-on-surface": "#f0f0f4",
              "secondary-fixed": "#ffdad8",
              "surface-variant": "#e2e2e6",
              "surface-dim": "#d9dade",
              "on-primary-container": "#fdfcff",
              "secondary-fixed-dim": "#ffb3b0",
              "on-surface-variant": "#414751",
              "surface-bright": "#f9f9fd",
              "on-surface": "#1a1c1f",
              "on-error": "#ffffff",
              "inverse-surface": "#2e3034",
              "on-secondary-fixed-variant": "#8c1520",
              "surface-container-low": "#f3f3f7",
              "tertiary": "#7b5500",
              "on-primary-fixed": "#001c37",
              "inverse-primary": "#a0caff",
              "primary-fixed-dim": "#a0caff",
              "tertiary-container": "#9a6c00",
              "background": "#f9f9fd",
              "on-primary": "#ffffff",
              "on-secondary-container": "#6d0010",
              "on-secondary": "#ffffff",
              "surface-container-high": "#e8e8ec",
              "error-container": "#ffdad6",
              "on-tertiary": "#ffffff",
              "on-tertiary-fixed": "#271900",
              "tertiary-fixed": "#ffdeab",
              "surface-container-highest": "#e2e2e6",
              "primary-container": "#2b78bf",
              "surface-container": "#ededf1",
              "on-primary-fixed-variant": "#00497e"
            },
            fontFamily: {
              "headline": ["Manrope"],
              "body": ["Be Vietnam Pro"],
              "label": ["Be Vietnam Pro"]
            },
            borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface font-body text-on-surface">
<!-- Background Content Simulation (My Closet) -->
<div class="fixed inset-0 z-0 overflow-y-auto pb-32">
<header class="p-6 flex justify-between items-center">
<h1 class="font-headline font-extrabold text-2xl tracking-tighter text-on-background">My Closet</h1>
<span class="material-symbols-outlined text-on-surface-variant">search</span>
</header>
<div class="px-6 grid grid-cols-2 gap-4">
<div class="aspect-[3/4] rounded-xl bg-surface-container-low p-4 flex flex-col justify-end">
<div class="w-full h-full mb-4 bg-white/40 rounded-lg"></div>
<p class="text-xs font-bold text-on-surface-variant">Oversized Trench</p>
</div>
<div class="aspect-[3/4] rounded-xl bg-surface-container-low p-4 flex flex-col justify-end">
<div class="w-full h-full mb-4 bg-white/40 rounded-lg"></div>
<p class="text-xs font-bold text-on-surface-variant">Cashmere Knit</p>
</div>
<div class="aspect-[3/4] rounded-xl bg-surface-container-low p-4 flex flex-col justify-end">
<div class="w-full h-full mb-4 bg-white/40 rounded-lg"></div>
<p class="text-xs font-bold text-on-surface-variant">Selvedge Denim</p>
</div>
<div class="aspect-[3/4] rounded-xl bg-surface-container-low p-4 flex flex-col justify-end">
<div class="w-full h-full mb-4 bg-white/40 rounded-lg"></div>
<p class="text-xs font-bold text-on-surface-variant">Leather Boots</p>
</div>
</div>
</div>
<!-- Modal Overlay -->
<div class="fixed inset-0 z-50 flex items-end justify-center bg-[#1a1c1f]/40 backdrop-blur-[8px]">
<!-- Bottom Sheet Modal Card -->
<div class="w-full max-w-md bg-surface-container-lowest rounded-t-[16px] shadow-[0px_-10px_30px_rgba(0,0,0,0.05)] animate-slide-up">
<!-- Handle Decor -->
<div class="w-full flex justify-center pt-3 pb-1">
<div class="w-10 h-1 rounded-full bg-surface-variant/50"></div>
</div>
<!-- Header -->
<header class="flex items-center justify-between px-6 py-4">
<h2 class="font-headline font-bold text-[20px] text-on-background tracking-tight">옷 등록하기</h2>
<button class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-surface-container-low transition-colors">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="close">close</span>
</button>
</header>
<div class="px-6 pb-10 space-y-8">
<!-- Step 1: Category -->
<section class="space-y-3">
<label class="block text-[12px] font-semibold text-on-surface-variant uppercase tracking-wider">카테고리</label>
<div class="flex flex-wrap gap-2">
<button class="px-4 py-2.5 rounded-xl text-sm font-semibold transition-all bg-primary-fixed text-on-primary-fixed-variant">아우터</button>
<button class="px-4 py-2.5 rounded-xl text-sm font-semibold transition-all bg-surface-container-low text-on-surface-variant hover:bg-surface-container-high">상의</button>
<button class="px-4 py-2.5 rounded-xl text-sm font-semibold transition-all bg-surface-container-low text-on-surface-variant hover:bg-surface-container-high">하의</button>
<button class="px-4 py-2.5 rounded-xl text-sm font-semibold transition-all bg-surface-container-low text-on-surface-variant hover:bg-surface-container-high">신발</button>
<button class="px-4 py-2.5 rounded-xl text-sm font-semibold transition-all bg-surface-container-low text-on-surface-variant hover:bg-surface-container-high">액세서리</button>
</div>
</section>
<!-- Step 2: Sub-category -->
<section class="space-y-3">
<label class="block text-[12px] font-semibold text-on-surface-variant uppercase tracking-wider">세부 카테고리</label>
<div class="flex overflow-x-auto no-scrollbar gap-2 -mx-1 px-1">
<button class="whitespace-nowrap px-4 py-2 rounded-lg text-sm bg-surface-container-low text-on-surface-variant border border-transparent">패딩</button>
<button class="whitespace-nowrap px-4 py-2 rounded-lg text-sm bg-surface-container-low text-on-surface-variant border border-transparent">코트</button>
<button class="whitespace-nowrap px-4 py-2 rounded-lg text-sm bg-primary-fixed text-on-primary-fixed-variant border border-primary/10">자켓</button>
<button class="whitespace-nowrap px-4 py-2 rounded-lg text-sm bg-surface-container-low text-on-surface-variant border border-transparent">가디건</button>
<button class="whitespace-nowrap px-4 py-2 rounded-lg text-sm bg-surface-container-low text-on-surface-variant border border-transparent">바람막이</button>
<button class="whitespace-nowrap px-4 py-2 rounded-lg text-sm bg-surface-container-low text-on-surface-variant border border-transparent">점퍼</button>
</div>
</section>
<!-- Step 3: Color Picker -->
<section class="space-y-3">
<label class="block text-[12px] font-semibold text-on-surface-variant uppercase tracking-wider">색상</label>
<div class="grid grid-cols-7 gap-y-4 gap-x-2">
<div class="flex flex-col items-center gap-1.5">
<div class="w-9 h-9 rounded-full bg-[#333333] border-2 border-white shadow-[0px_4px_12px_rgba(0,0,0,0.15)] ring-2 ring-primary-container/20"></div>
<span class="text-[10px] text-on-surface-variant font-medium">검정</span>
</div>
<div class="flex flex-col items-center gap-1.5 opacity-60">
<div class="w-9 h-9 rounded-full bg-[#FFFFFF] border border-outline-variant/30"></div>
<span class="text-[10px] text-on-surface-variant font-medium">하얀</span>
</div>
<div class="flex flex-col items-center gap-1.5 opacity-60">
<div class="w-9 h-9 rounded-full bg-[#808080]"></div>
<span class="text-[10px] text-on-surface-variant font-medium">회색</span>
</div>
<div class="flex flex-col items-center gap-1.5 opacity-60">
<div class="w-9 h-9 rounded-full bg-[#1E3A8A]"></div>
<span class="text-[10px] text-on-surface-variant font-medium">네이비</span>
</div>
<div class="flex flex-col items-center gap-1.5 opacity-60">
<div class="w-9 h-9 rounded-full bg-[#F5E6D3]"></div>
<span class="text-[10px] text-on-surface-variant font-medium">베이지</span>
</div>
<div class="flex flex-col items-center gap-1.5 opacity-60">
<div class="w-9 h-9 rounded-full bg-[#4B3621]"></div>
<span class="text-[10px] text-on-surface-variant font-medium">브라운</span>
</div>
<div class="flex flex-col items-center gap-1.5 opacity-60">
<div class="w-9 h-9 rounded-full bg-[#34D399]"></div>
<span class="text-[10px] text-on-surface-variant font-medium">민트</span>
</div>
<!-- ... More colors can be added here if needed to reach 13 -->
</div>
</section>
<!-- Preview Area -->
<div class="pt-4 flex justify-center">
<div class="bg-surface-container px-4 py-2 rounded-full inline-flex items-center gap-2">
<span class="text-sm font-semibold text-on-surface-variant tracking-tight">🧥 자켓 · 블랙</span>
</div>
</div>
<!-- Primary Action -->
<div class="pt-2">
<button class="w-full h-[52px] bg-primary text-white font-semibold rounded-xl flex items-center justify-center shadow-lg shadow-primary/20 active:scale-[0.98] transition-all">
                        등록하기
                    </button>
</div>
</div>
</div>
</div>
<!-- Bottom Nav Bar (Suppressed on transactional modal, but following schema for placement reference) -->
<nav class="fixed bottom-0 w-full flex justify-around items-center px-4 pb-6 pt-3 bg-white/70 backdrop-blur-xl z-10 opacity-40 pointer-events-none">
<div class="flex flex-col items-center justify-center bg-sky-100/50 text-sky-800 rounded-xl px-4 py-1.5">
<span class="material-symbols-outlined" data-icon="checkroom">checkroom</span>
<span class="font-headline text-[10px] font-semibold uppercase tracking-wider">Closet</span>
</div>
<div class="flex flex-col items-center justify-center text-slate-500 px-4 py-1.5">
<span class="material-symbols-outlined" data-icon="auto_awesome">auto_awesome</span>
<span class="font-headline text-[10px] font-semibold uppercase tracking-wider">Style</span>
</div>
<div class="flex flex-col items-center justify-center text-slate-500 px-4 py-1.5">
<span class="material-symbols-outlined" data-icon="cloud">cloud</span>
<span class="font-headline text-[10px] font-semibold uppercase tracking-wider">Weather</span>
</div>
<div class="flex flex-col items-center justify-center text-slate-500 px-4 py-1.5">
<span class="material-symbols-outlined" data-icon="person">person</span>
<span class="font-headline text-[10px] font-semibold uppercase tracking-wider">Profile</span>
</div>
</nav>
</body></html>
