<!DOCTYPE html>

<html lang="ko"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;700;800&amp;family=Be+Vietnam+Pro:wght@300;400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "surface-dim": "#d9dade",
              "primary-fixed-dim": "#a0caff",
              "primary-container": "#2b78bf",
              "on-tertiary-fixed-variant": "#5f4100",
              "tertiary-container": "#9a6c00",
              "surface-container": "#ededf1",
              "outline": "#717782",
              "tertiary": "#7b5500",
              "surface-container-high": "#e8e8ec",
              "primary": "#005ea1",
              "tertiary-fixed-dim": "#fbbb45",
              "inverse-on-surface": "#f0f0f4",
              "inverse-primary": "#a0caff",
              "surface-tint": "#0061a5",
              "on-background": "#1a1c1f",
              "on-surface": "#1a1c1f",
              "secondary-fixed-dim": "#ffb3b0",
              "on-surface-variant": "#414751",
              "on-error-container": "#93000a",
              "background": "#f9f9fd",
              "on-secondary-fixed": "#410006",
              "surface-container-low": "#f3f3f7",
              "error-container": "#ffdad6",
              "primary-fixed": "#d2e4ff",
              "surface-bright": "#f9f9fd",
              "on-tertiary-container": "#fffbff",
              "on-secondary-container": "#6d0010",
              "secondary-container": "#ff6b6b",
              "on-tertiary": "#ffffff",
              "on-secondary": "#ffffff",
              "secondary": "#ae2f34",
              "on-primary-container": "#fdfcff",
              "surface-variant": "#e2e2e6",
              "outline-variant": "#c1c7d2",
              "on-error": "#ffffff",
              "surface-container-highest": "#e2e2e6",
              "inverse-surface": "#2e3034",
              "secondary-fixed": "#ffdad8",
              "on-primary-fixed-variant": "#00497e",
              "on-tertiary-fixed": "#271900",
              "on-primary": "#ffffff",
              "surface": "#f9f9fd",
              "surface-container-lowest": "#ffffff",
              "on-secondary-fixed-variant": "#8c1520",
              "on-primary-fixed": "#001c37",
              "error": "#ba1a1a",
              "tertiary-fixed": "#ffdeab"
            },
            fontFamily: {
              "headline": ["Manrope"],
              "body": ["Be Vietnam Pro"],
              "label": ["Be Vietnam Pro"]
            },
            borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            font-family: 'Be Vietnam Pro', sans-serif;
            background-color: #f9f9fd;
        }
        .hero-gradient {
            background: linear-gradient(135deg, #005ea1 0%, #2b78bf 100%);
        }
        .ambient-shadow {
            box-shadow: 0px 20px 40px rgba(26, 28, 31, 0.06);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="flex flex-col min-h-screen text-on-surface">
<!-- Top Navigation Shell (Suppressed for Registration Flow per Mandate) -->
<main class="flex-grow">
<!-- Hero Section: ~25% Screen height -->
<section class="hero-gradient h-[221px] min-h-[220px] relative px-8 pt-12">
<div class="flex flex-col gap-4">
<button aria-label="Back" class="w-10 h-10 flex items-center justify-start text-white active:scale-95 transition-transform">
<span class="material-symbols-outlined text-[28px]">arrow_back</span>
</button>
<div class="space-y-1">
<h1 class="text-[24px] font-bold font-headline text-white tracking-tight">회원가입</h1>
<p class="text-[14px] text-white/80 font-body">간단한 정보만 입력하면 바로 시작할 수 있어요</p>
</div>
</div>
</section>
<!-- Registration Form Card: Overlapping Hero -->
<section class="px-6 -mt-5 relative z-10 mb-12">
<div class="bg-surface-container-lowest rounded-xl ambient-shadow p-8 flex flex-col gap-6">
<!-- Form Fields -->
<div class="space-y-4">
<!-- Name Field -->
<div class="flex flex-col gap-2">
<label class="text-[12px] font-medium text-on-surface-variant font-label px-1">이름</label>
<input class="w-full h-12 px-4 rounded-lg bg-surface-container-low border-none focus:ring-2 focus:ring-primary/20 focus:bg-surface-variant transition-all placeholder:text-outline/50 text-[15px]" placeholder="홍길동" type="text"/>
</div>
<!-- Email Field -->
<div class="flex flex-col gap-2">
<label class="text-[12px] font-medium text-on-surface-variant font-label px-1">이메일</label>
<input class="w-full h-12 px-4 rounded-lg bg-surface-container-low border-none focus:ring-2 focus:ring-primary/20 focus:bg-surface-variant transition-all placeholder:text-outline/50 text-[15px]" placeholder="example@email.com" type="email"/>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-2">
<label class="text-[12px] font-medium text-on-surface-variant font-label px-1">비밀번호</label>
<div class="relative">
<input class="w-full h-12 px-4 pr-12 rounded-lg bg-surface-container-low border-none focus:ring-2 focus:ring-primary/20 focus:bg-surface-variant transition-all placeholder:text-outline/50 text-[15px]" placeholder="8자 이상 입력하세요" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant/60">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
</div>
<!-- Confirm Password Field -->
<div class="flex flex-col gap-2">
<label class="text-[12px] font-medium text-on-surface-variant font-label px-1">비밀번호 확인</label>
<div class="relative">
<input class="w-full h-12 px-4 pr-12 rounded-lg bg-surface-container-low border-none focus:ring-2 focus:ring-primary/20 focus:bg-surface-variant transition-all placeholder:text-outline/50 text-[15px]" placeholder="비밀번호를 다시 입력하세요" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant/60">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
</div>
</div>
<!-- Sign Up Button -->
<div class="mt-2">
<button class="w-full h-[52px] bg-primary text-on-primary rounded-xl font-medium text-[16px] shadow-sm active:scale-[0.98] transition-all hover:opacity-90 flex items-center justify-center">
                        회원가입
                    </button>
</div>
<!-- Login Link -->
<div class="text-center pt-2">
<p class="text-[14px] text-on-surface-variant">
                        이미 계정이 있으신가요? <a class="text-primary font-bold ml-1 hover:underline" href="#">로그인</a>
</p>
</div>
</div>
</section>
</main>
<!-- Footer: Terms and Conditions -->
<footer class="w-full mt-auto bg-slate-50 dark:bg-slate-900/50 flex flex-col items-center gap-4 py-12 px-6">
<div class="max-w-xs text-center">
<p class="font-['Be_Vietnam_Pro'] text-xs leading-relaxed tracking-wide text-slate-500 dark:text-slate-400">
                가입 시 Atmospheric Curator의 <span class="text-blue-600 dark:text-blue-400 underline underline-offset-4 cursor-pointer">이용약관</span> 및 <span class="text-blue-600 dark:text-blue-400 underline underline-offset-4 cursor-pointer">개인정보 처리방침</span>에 동의하게 됩니다.
            </p>
</div>
<p class="font-['Be_Vietnam_Pro'] text-xs leading-relaxed tracking-wide text-slate-500 dark:text-slate-400 mt-4">
            © 2024 Atmospheric Curator. All rights reserved.
        </p>
<div class="flex gap-4">
<span class="font-['Be_Vietnam_Pro'] text-xs leading-relaxed tracking-wide text-slate-500 dark:text-slate-400 hover:text-coral-500 dark:hover:text-coral-400 transition-colors duration-300 cursor-pointer">Terms of Service</span>
<span class="font-['Be_Vietnam_Pro'] text-xs leading-relaxed tracking-wide text-slate-500 dark:text-slate-400 hover:text-coral-500 dark:hover:text-coral-400 transition-colors duration-300 cursor-pointer">Privacy Policy</span>
<span class="font-['Be_Vietnam_Pro'] text-xs leading-relaxed tracking-wide text-slate-500 dark:text-slate-400 hover:text-coral-500 dark:hover:text-coral-400 transition-colors duration-300 cursor-pointer">Style Guide</span>
</div>
</footer>
</body></html>
