<!DOCTYPE html>
<html class="light" lang="ko"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>카테고리 관리 — Admin (Desktop)</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Be+Vietnam+Pro:wght@400;500;600&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          "primary": "#005ea1",
          "on-primary": "#ffffff",
          "primary-container": "#2b78bf",
          "primary-fixed": "#d2e4ff",
          "on-primary-fixed-variant": "#00497e",
          "secondary": "#ae2f34",
          "secondary-container": "#ff6b6b",
          "surface": "#f9f9fd",
          "surface-container-low": "#f3f3f7",
          "surface-container": "#ededf1",
          "surface-container-high": "#e8e8ec",
          "surface-container-lowest": "#ffffff",
          "on-surface": "#1a1c1f",
          "on-surface-variant": "#414751",
          "outline": "#717782",
          "outline-variant": "#c1c7d2",
          "error": "#ba1a1a",
          "error-container": "#ffdad6",
          "on-error-container": "#93000a",
          "background": "#f9f9fd",
          "tertiary": "#7b5500",
          "tertiary-fixed": "#ffdeab",
        },
        fontFamily: {
          "headline": ["Manrope"],
          "body": ["Be Vietnam Pro"],
        },
      },
    },
  }
</script>
<style>
  .material-symbols-outlined {
    font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
  }
  body { font-family: 'Be Vietnam Pro', sans-serif; }
</style>
</head>
<body class="bg-background font-body text-on-surface antialiased">

<!-- Top Navigation Bar -->
<header class="flex items-center justify-between px-8 w-full sticky top-0 z-50 h-[56px] bg-white shadow-[0px_20px_40px_rgba(26,28,31,0.06)] font-['Manrope'] antialiased tracking-wide text-sm font-medium">
  <div class="flex items-center gap-12">
    <span class="text-xl font-extrabold tracking-tighter text-blue-800">오늘 뭐 입지?</span>
    <nav class="hidden md:flex gap-8 h-full">
      <a class="flex items-center text-slate-500 hover:text-blue-600 transition-colors" href="#">오늘의 코디</a>
      <a class="flex items-center text-slate-500 hover:text-blue-600 transition-colors" href="#">내 옷장</a>
      <a class="flex items-center text-blue-700 border-b-2 border-blue-700 pb-1 font-bold" href="#">관리</a>
    </nav>
  </div>
  <div class="flex items-center gap-3">
    <span class="px-2.5 py-1 rounded-full bg-tertiary-fixed text-[11px] font-semibold text-tertiary">ADMIN</span>
    <button class="p-2 rounded-full hover:bg-slate-50 transition-all">
      <span class="material-symbols-outlined text-on-surface-variant">account_circle</span>
    </button>
  </div>
</header>

<main class="max-w-[900px] mx-auto px-8 py-8">
  <!-- Header -->
  <section class="flex justify-between items-center mb-10">
    <div>
      <h1 class="text-[28px] font-extrabold font-['Manrope'] tracking-tight text-on-surface">카테고리 관리</h1>
      <p class="text-sm text-on-surface-variant mt-1">옷 카테고리를 추가, 수정, 삭제할 수 있습니다</p>
    </div>
    <button class="py-2.5 px-5 rounded-xl border-2 border-dashed border-outline-variant/40 text-on-surface-variant text-sm font-medium flex items-center gap-2 hover:border-primary/30 hover:text-primary transition-colors">
      <span class="material-symbols-outlined text-[20px]">add_circle_outline</span>
      새 상위분류 추가
    </button>
  </section>

  <div class="space-y-4">

    <!-- Accordion: 아우터 (펼침 상태) -->
    <section class="bg-surface-container-lowest rounded-2xl shadow-[0px_20px_40px_rgba(26,28,31,0.06)] overflow-hidden">
      <!-- Accordion Header -->
      <button class="w-full flex items-center justify-between p-5 hover:bg-surface-container-low/50 transition-colors">
        <div class="flex items-center gap-4">
          <span class="material-symbols-outlined text-on-surface-variant" style="font-variation-settings: 'FILL' 1;">expand_more</span>
          <span class="text-xl">🧥</span>
          <h2 class="text-lg font-bold font-['Manrope'] text-on-surface">아우터</h2>
          <span class="text-xs text-outline font-medium bg-surface-container-high px-2 py-0.5 rounded">6</span>
        </div>
        <button class="text-primary text-sm font-semibold flex items-center gap-1 px-3 py-1.5 rounded-lg hover:bg-primary-fixed/50 transition-colors">
          <span class="material-symbols-outlined text-[18px]">add</span>
          카테고리 추가
        </button>
      </button>

      <!-- Table Header -->
      <div class="grid grid-cols-[1fr_60px_100px_70px_80px] gap-4 px-6 py-2 text-[11px] font-semibold text-outline uppercase tracking-wider border-t border-outline-variant/10">
        <span>이름</span>
        <span class="text-center">아이콘</span>
        <span class="text-center">온도 범위</span>
        <span class="text-center">순서</span>
        <span class="text-center">작업</span>
      </div>

      <!-- Row: 패딩 -->
      <div class="grid grid-cols-[1fr_60px_100px_70px_80px] gap-4 items-center px-6 py-3 border-t border-outline-variant/10 hover:bg-surface-container-low/30 transition-colors">
        <span class="text-[15px] font-medium text-on-surface">패딩</span>
        <span class="text-center text-base">🧥</span>
        <span class="text-center text-xs text-on-surface-variant">-5° ~ 10°</span>
        <span class="text-center text-xs text-on-surface-variant">1</span>
        <div class="flex items-center justify-center gap-1">
          <button class="p-1.5 rounded-lg hover:bg-surface-container-high transition-colors">
            <span class="material-symbols-outlined text-[18px] text-on-surface-variant">edit</span>
          </button>
          <button class="p-1.5 rounded-lg hover:bg-error-container transition-colors">
            <span class="material-symbols-outlined text-[18px] text-on-surface-variant">delete</span>
          </button>
        </div>
      </div>

      <!-- Row: 코트 -->
      <div class="grid grid-cols-[1fr_60px_100px_70px_80px] gap-4 items-center px-6 py-3 border-t border-outline-variant/10 hover:bg-surface-container-low/30 transition-colors">
        <span class="text-[15px] font-medium text-on-surface">코트</span>
        <span class="text-center text-base">🧥</span>
        <span class="text-center text-xs text-on-surface-variant">0° ~ 15°</span>
        <span class="text-center text-xs text-on-surface-variant">2</span>
        <div class="flex items-center justify-center gap-1">
          <button class="p-1.5 rounded-lg hover:bg-surface-container-high transition-colors">
            <span class="material-symbols-outlined text-[18px] text-on-surface-variant">edit</span>
          </button>
          <button class="p-1.5 rounded-lg hover:bg-error-container transition-colors">
            <span class="material-symbols-outlined text-[18px] text-on-surface-variant">delete</span>
          </button>
        </div>
      </div>

      <!-- Row: 자켓 (인라인 편집 모드) -->
      <div class="grid grid-cols-[1fr_60px_100px_70px_80px] gap-4 items-center px-6 py-3 border-t border-primary/15 bg-primary-fixed/15">
        <input type="text" value="자켓" class="bg-surface-container-lowest text-[15px] font-medium text-on-surface px-3 py-1.5 rounded-lg focus:outline-none focus:ring-1 focus:ring-primary/30" />
        <input type="text" value="🧥" class="bg-surface-container-lowest text-center text-base px-1 py-1.5 rounded-lg focus:outline-none focus:ring-1 focus:ring-primary/30" />
        <div class="flex items-center gap-1 justify-center">
          <input type="number" value="10" class="w-12 bg-surface-container-lowest text-xs text-center px-1 py-1.5 rounded-lg focus:outline-none focus:ring-1 focus:ring-primary/30" />
          <span class="text-[10px] text-outline">~</span>
          <input type="number" value="25" class="w-12 bg-surface-container-lowest text-xs text-center px-1 py-1.5 rounded-lg focus:outline-none focus:ring-1 focus:ring-primary/30" />
        </div>
        <input type="number" value="3" class="w-12 mx-auto bg-surface-container-lowest text-xs text-center px-1 py-1.5 rounded-lg focus:outline-none focus:ring-1 focus:ring-primary/30" />
        <div class="flex items-center justify-center gap-1">
          <button class="px-2.5 py-1 rounded-lg bg-primary text-on-primary text-xs font-semibold">저장</button>
          <button class="px-2.5 py-1 rounded-lg bg-surface-container-high text-on-surface-variant text-xs">취소</button>
        </div>
      </div>

      <!-- Row: 가디건 -->
      <div class="grid grid-cols-[1fr_60px_100px_70px_80px] gap-4 items-center px-6 py-3 border-t border-outline-variant/10 hover:bg-surface-container-low/30 transition-colors">
        <span class="text-[15px] font-medium text-on-surface">가디건</span>
        <span class="text-center text-base">🧥</span>
        <span class="text-center text-xs text-on-surface-variant">10° ~ 20°</span>
        <span class="text-center text-xs text-on-surface-variant">4</span>
        <div class="flex items-center justify-center gap-1">
          <button class="p-1.5 rounded-lg hover:bg-surface-container-high transition-colors">
            <span class="material-symbols-outlined text-[18px] text-on-surface-variant">edit</span>
          </button>
          <button class="p-1.5 rounded-lg hover:bg-error-container transition-colors">
            <span class="material-symbols-outlined text-[18px] text-on-surface-variant">delete</span>
          </button>
        </div>
      </div>

      <!-- Row: 바람막이 -->
      <div class="grid grid-cols-[1fr_60px_100px_70px_80px] gap-4 items-center px-6 py-3 border-t border-outline-variant/10 hover:bg-surface-container-low/30 transition-colors">
        <span class="text-[15px] font-medium text-on-surface">바람막이</span>
        <span class="text-center text-base">🧥</span>
        <span class="text-center text-xs text-on-surface-variant">5° ~ 20°</span>
        <span class="text-center text-xs text-on-surface-variant">5</span>
        <div class="flex items-center justify-center gap-1">
          <button class="p-1.5 rounded-lg hover:bg-surface-container-high transition-colors">
            <span class="material-symbols-outlined text-[18px] text-on-surface-variant">edit</span>
          </button>
          <button class="p-1.5 rounded-lg hover:bg-error-container transition-colors">
            <span class="material-symbols-outlined text-[18px] text-on-surface-variant">delete</span>
          </button>
        </div>
      </div>

      <!-- Row: 점퍼 -->
      <div class="grid grid-cols-[1fr_60px_100px_70px_80px] gap-4 items-center px-6 py-3 border-t border-outline-variant/10 hover:bg-surface-container-low/30 transition-colors">
        <span class="text-[15px] font-medium text-on-surface">점퍼</span>
        <span class="text-center text-base">🧥</span>
        <span class="text-center text-xs text-on-surface-variant">0° ~ 15°</span>
        <span class="text-center text-xs text-on-surface-variant">6</span>
        <div class="flex items-center justify-center gap-1">
          <button class="p-1.5 rounded-lg hover:bg-surface-container-high transition-colors">
            <span class="material-symbols-outlined text-[18px] text-on-surface-variant">edit</span>
          </button>
          <button class="p-1.5 rounded-lg hover:bg-error-container transition-colors">
            <span class="material-symbols-outlined text-[18px] text-on-surface-variant">delete</span>
          </button>
        </div>
      </div>
    </section>

    <!-- Accordion: 상의 (접힌 상태) -->
    <section class="bg-surface-container-lowest rounded-2xl shadow-[0px_20px_40px_rgba(26,28,31,0.06)]">
      <button class="w-full flex items-center justify-between p-5 hover:bg-surface-container-low/50 transition-colors rounded-2xl">
        <div class="flex items-center gap-4">
          <span class="material-symbols-outlined text-on-surface-variant">chevron_right</span>
          <span class="text-xl">👕</span>
          <h2 class="text-lg font-bold font-['Manrope'] text-on-surface">상의</h2>
          <span class="text-xs text-outline font-medium bg-surface-container-high px-2 py-0.5 rounded">7</span>
        </div>
        <button class="text-primary text-sm font-semibold flex items-center gap-1 px-3 py-1.5 rounded-lg hover:bg-primary-fixed/50 transition-colors">
          <span class="material-symbols-outlined text-[18px]">add</span>
          카테고리 추가
        </button>
      </button>
    </section>

    <!-- Accordion: 하의 (접힌 상태) -->
    <section class="bg-surface-container-lowest rounded-2xl shadow-[0px_20px_40px_rgba(26,28,31,0.06)]">
      <button class="w-full flex items-center justify-between p-5 hover:bg-surface-container-low/50 transition-colors rounded-2xl">
        <div class="flex items-center gap-4">
          <span class="material-symbols-outlined text-on-surface-variant">chevron_right</span>
          <span class="text-xl">👖</span>
          <h2 class="text-lg font-bold font-['Manrope'] text-on-surface">하의</h2>
          <span class="text-xs text-outline font-medium bg-surface-container-high px-2 py-0.5 rounded">6</span>
        </div>
        <button class="text-primary text-sm font-semibold flex items-center gap-1 px-3 py-1.5 rounded-lg hover:bg-primary-fixed/50 transition-colors">
          <span class="material-symbols-outlined text-[18px]">add</span>
          카테고리 추가
        </button>
      </button>
    </section>

    <!-- Accordion: 신발 (접힌 상태) -->
    <section class="bg-surface-container-lowest rounded-2xl shadow-[0px_20px_40px_rgba(26,28,31,0.06)]">
      <button class="w-full flex items-center justify-between p-5 hover:bg-surface-container-low/50 transition-colors rounded-2xl">
        <div class="flex items-center gap-4">
          <span class="material-symbols-outlined text-on-surface-variant">chevron_right</span>
          <span class="text-xl">👟</span>
          <h2 class="text-lg font-bold font-['Manrope'] text-on-surface">신발</h2>
          <span class="text-xs text-outline font-medium bg-surface-container-high px-2 py-0.5 rounded">5</span>
        </div>
        <button class="text-primary text-sm font-semibold flex items-center gap-1 px-3 py-1.5 rounded-lg hover:bg-primary-fixed/50 transition-colors">
          <span class="material-symbols-outlined text-[18px]">add</span>
          카테고리 추가
        </button>
      </button>
    </section>

    <!-- Accordion: 액세서리 (접힌 상태) -->
    <section class="bg-surface-container-lowest rounded-2xl shadow-[0px_20px_40px_rgba(26,28,31,0.06)]">
      <button class="w-full flex items-center justify-between p-5 hover:bg-surface-container-low/50 transition-colors rounded-2xl">
        <div class="flex items-center gap-4">
          <span class="material-symbols-outlined text-on-surface-variant">chevron_right</span>
          <span class="text-xl">🎩</span>
          <h2 class="text-lg font-bold font-['Manrope'] text-on-surface">액세서리</h2>
          <span class="text-xs text-outline font-medium bg-surface-container-high px-2 py-0.5 rounded">4</span>
        </div>
        <button class="text-primary text-sm font-semibold flex items-center gap-1 px-3 py-1.5 rounded-lg hover:bg-primary-fixed/50 transition-colors">
          <span class="material-symbols-outlined text-[18px]">add</span>
          카테고리 추가
        </button>
      </button>
    </section>

  </div>
</main>

<!-- Delete Confirmation Dialog (with clothes warning) -->
<div class="fixed inset-0 bg-black/30 backdrop-blur-sm z-50 flex items-center justify-center" id="delete-dialog">
  <div class="bg-surface-container-lowest w-full max-w-[420px] rounded-2xl p-8 shadow-[0px_20px_60px_rgba(26,28,31,0.15)]">
    <div class="flex items-center gap-3 mb-4">
      <div class="w-10 h-10 rounded-full bg-error-container flex items-center justify-center">
        <span class="material-symbols-outlined text-on-error-container">warning</span>
      </div>
      <h3 class="font-['Manrope'] font-bold text-lg text-on-surface">카테고리 삭제</h3>
    </div>
    <p class="text-sm text-on-surface-variant mb-2">"패딩" 카테고리를 삭제하시겠습니까?</p>
    <div class="bg-error-container/30 rounded-lg px-4 py-3 mb-6">
      <p class="text-xs text-on-error-container flex items-center gap-1.5">
        <span class="material-symbols-outlined text-[16px]">info</span>
        이 카테고리에 등록된 옷 <strong>3개</strong>도 함께 삭제됩니다.
      </p>
    </div>
    <div class="flex gap-3">
      <button class="flex-1 py-3 rounded-xl bg-surface-container-high text-on-surface-variant text-sm font-medium hover:bg-surface-container transition-colors">취소</button>
      <button class="flex-1 py-3 rounded-xl bg-error text-on-error text-sm font-semibold hover:opacity-90 transition-opacity">삭제</button>
    </div>
  </div>
</div>

</body></html>
