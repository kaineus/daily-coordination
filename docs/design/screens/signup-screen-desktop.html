<!DOCTYPE html>

<html lang="ko"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>회원가입 - 오늘 뭐 입지?</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=Be+Vietnam+Pro:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "secondary": "#ae2f34",
                        "tertiary": "#7b5500",
                        "on-tertiary-fixed": "#271900",
                        "secondary-fixed": "#ffdad8",
                        "on-primary-fixed-variant": "#00497e",
                        "primary-fixed": "#d2e4ff",
                        "on-primary": "#ffffff",
                        "surface-container-lowest": "#ffffff",
                        "surface-container": "#ededf1",
                        "tertiary-container": "#9a6c00",
                        "surface-variant": "#e2e2e6",
                        "surface-container-highest": "#e2e2e6",
                        "surface-container-high": "#e8e8ec",
                        "on-secondary-fixed": "#410006",
                        "on-primary-fixed": "#001c37",
                        "on-surface": "#1a1c1f",
                        "surface-tint": "#0061a5",
                        "primary": "#005ea1",
                        "surface": "#f9f9fd",
                        "primary-fixed-dim": "#a0caff",
                        "on-secondary": "#ffffff",
                        "inverse-on-surface": "#f0f0f4",
                        "outline": "#717782",
                        "error-container": "#ffdad6",
                        "error": "#ba1a1a",
                        "primary-container": "#2b78bf",
                        "tertiary-fixed-dim": "#fbbb45",
                        "background": "#f9f9fd",
                        "on-tertiary-container": "#fffbff",
                        "tertiary-fixed": "#ffdeab",
                        "surface-bright": "#f9f9fd",
                        "secondary-fixed-dim": "#ffb3b0",
                        "secondary-container": "#ff6b6b",
                        "on-error": "#ffffff",
                        "surface-dim": "#d9dade",
                        "on-primary-container": "#fdfcff",
                        "on-surface-variant": "#414751",
                        "on-secondary-fixed-variant": "#8c1520",
                        "on-background": "#1a1c1f",
                        "inverse-surface": "#2e3034",
                        "on-tertiary-fixed-variant": "#5f4100",
                        "inverse-primary": "#a0caff",
                        "on-error-container": "#93000a",
                        "surface-container-low": "#f3f3f7",
                        "outline-variant": "#c1c7d2",
                        "on-tertiary": "#ffffff",
                        "on-secondary-container": "#6d0010"
                    },
                    fontFamily: {
                        "headline": ["Manrope"],
                        "body": ["Be Vietnam Pro"],
                        "label": ["Be Vietnam Pro"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        body { font-family: 'Be Vietnam Pro', 'Pretendard', sans-serif; }
        .font-headline { font-family: 'Manrope', sans-serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-background text-on-background antialiased overflow-hidden">
<main class="flex min-h-screen w-full">
<!-- Left Panel: Branding & Atmosphere -->
<section class="hidden lg:flex lg:w-1/2 flex-col justify-center items-center relative overflow-hidden bg-gradient-to-br from-primary to-primary-container">
<!-- Decorative Floating Icons -->
<div class="absolute top-12 left-12 opacity-20 text-white select-none">
<span class="material-symbols-outlined text-8xl">sunny</span>
</div>
<div class="absolute bottom-24 right-16 opacity-20 text-white select-none">
<span class="material-symbols-outlined text-7xl">cloud</span>
</div>
<div class="absolute top-1/2 right-12 opacity-10 text-white select-none">
<span class="material-symbols-outlined text-6xl">umbrella</span>
</div>
<div class="absolute bottom-12 left-20 opacity-15 text-white select-none">
<span class="material-symbols-outlined text-5xl">ac_unit</span>
</div>
<!-- Content Area -->
<div class="z-10 text-center flex flex-col items-center">
<div class="flex items-center justify-center mb-6">
<span class="material-symbols-outlined text-white text-[64px]" style="font-variation-settings: 'FILL' 1;">dry_cleaning</span>
</div>
<h1 class="font-headline text-white text-[40px] font-extrabold tracking-tighter mb-4">오늘 뭐 입지?</h1>
<p class="text-white/80 text-lg font-body max-w-md mx-auto leading-relaxed">
                    날씨에 맞는 오늘의 코디, AI가 추천해드려요
                </p>
</div>
<!-- Branding Accent -->
<div class="absolute bottom-12 text-white/40 font-headline text-sm tracking-[0.2em] uppercase">
                Atmospheric Curator
            </div>
</section>
<!-- Right Panel: Registration Form -->
<section class="w-full lg:w-1/2 flex flex-col justify-center items-center px-6 bg-surface">
<div class="w-full max-w-[440px] flex flex-col">
<!-- Back Button -->
<button class="flex items-center text-on-surface-variant hover:text-primary transition-colors mb-8 w-fit group">
<span class="material-symbols-outlined text-2xl group-active:scale-90 transition-transform">arrow_back</span>
</button>
<!-- Header -->
<header class="mb-10">
<h2 class="font-headline text-[28px] font-bold text-on-surface tracking-tight mb-2">회원가입</h2>
<p class="text-on-surface-variant text-sm font-body">간단한 정보만 입력하면 바로 시작할 수 있어요</p>
</header>
<!-- Form -->
<form class="space-y-5" onsubmit="return false;">
<!-- Name Input -->
<div class="flex flex-col gap-1.5">
<label class="text-xs font-semibold text-on-surface-variant ml-1 font-label">이름</label>
<div class="relative group">
<input class="w-full h-12 px-4 bg-surface-container-low border-none rounded-lg focus:ring-2 focus:ring-primary/20 transition-all text-on-surface placeholder:text-outline/50" placeholder="홍길동" type="text"/>
</div>
</div>
<!-- Email Input -->
<div class="flex flex-col gap-1.5">
<label class="text-xs font-semibold text-on-surface-variant ml-1 font-label">이메일</label>
<div class="relative">
<input class="w-full h-12 px-4 bg-surface-container-low border-none rounded-lg focus:ring-2 focus:ring-primary/20 transition-all text-on-surface placeholder:text-outline/50" placeholder="example@email.com" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-1.5">
<label class="text-xs font-semibold text-on-surface-variant ml-1 font-label">비밀번호</label>
<div class="relative flex items-center">
<input class="w-full h-12 px-4 bg-surface-container-low border-none rounded-lg focus:ring-2 focus:ring-primary/20 transition-all text-on-surface placeholder:text-outline/50" placeholder="8자 이상 입력하세요" type="password"/>
<button class="absolute right-3 text-outline hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined text-xl">visibility</span>
</button>
</div>
</div>
<!-- Confirm Password Input -->
<div class="flex flex-col gap-1.5">
<label class="text-xs font-semibold text-on-surface-variant ml-1 font-label">비밀번호 확인</label>
<div class="relative flex items-center">
<input class="w-full h-12 px-4 bg-surface-container-low border-none rounded-lg focus:ring-2 focus:ring-primary/20 transition-all text-on-surface placeholder:text-outline/50" placeholder="비밀번호를 다시 입력하세요" type="password"/>
<button class="absolute right-3 text-outline hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined text-xl">visibility</span>
</button>
</div>
</div>
<!-- Sign Up Button -->
<div class="pt-2">
<button class="w-full h-[52px] bg-primary text-white font-medium rounded-xl hover:opacity-90 active:scale-[0.98] transition-all shadow-sm flex items-center justify-center gap-2">
                            회원가입
                        </button>
</div>
</form>
<!-- Login Link -->
<div class="mt-8 text-center text-sm">
<span class="text-on-surface-variant">이미 계정이 있으신가요?</span>
<a class="ml-2 text-primary font-bold hover:underline decoration-primary/30 underline-offset-4" href="#">로그인</a>
</div>
<!-- Footer Terms (Absolute at bottom for clean split screen) -->
<footer class="mt-16 text-center lg:absolute lg:bottom-12 lg:left-1/2 lg:w-1/2 lg:translate-x-0 lg:ml-[-220px]">
<p class="text-[11px] text-outline/60 leading-relaxed font-body">
                        가입 시 서비스 <a class="underline" href="#">이용약관</a> 및 <a class="underline" href="#">개인정보 처리방침</a>에 동의하게 됩니다.<br/>
                        © 2024 오늘 뭐 입지? Atmospheric Curator. All rights reserved.
                    </p>
</footer>
</div>
</section>
</main>
<!-- Decorative Element for Background (Subtle Gradient Bleed) -->
<div class="fixed -bottom-24 -left-24 w-64 h-64 bg-primary/5 rounded-full blur-3xl pointer-events-none"></div>
<div class="fixed -top-24 -right-24 w-96 h-96 bg-secondary-container/5 rounded-full blur-3xl pointer-events-none"></div>
</body></html>
